name: Optional JAX-MPM smoke
on: workflow_dispatch
jobs:
  mpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mpm]'
      - run: python -m softgriplab mpm-grasp --grid 16 --frames 8 --output outputs/mpm
      - uses: actions/upload-artifact@v4
        with:
          name: mpm-smoke
          path: outputs/mpm/
