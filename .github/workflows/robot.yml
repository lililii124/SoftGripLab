name: Robot suction demo
on: [push, pull_request, workflow_dispatch]
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[robot,test]'
      - run: python -m pytest -q tests/test_suction.py tests/test_robot.py
      - run: python -m softgriplab robot-demo --output outputs/robot
      - uses: actions/upload-artifact@v4
        with:
          name: panda-suction-demo
          path: outputs/robot/
