name: Contact and deformation demos
on: [push, pull_request, workflow_dispatch]
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[robot,test]'
      - run: python -m pytest -q tests/test_suction.py tests/test_robot.py tests/test_fem.py
      - run: python -m softgriplab robot-demo --output outputs/robot
      - run: python -m softgriplab fem-demo --cells 5 --output outputs/fem_compression
      - uses: actions/upload-artifact@v4
        with:
          name: contact-deformation-demos
          path: |
            outputs/robot/
            outputs/fem_compression/
