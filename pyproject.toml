[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "softgriplab"
version = "0.3.0"
description = "Material identification, compliant grasp screening, and shock benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
robot = ["pybullet==3.2.7"]
mpm = ["jax-mpm @ git+https://github.com/lililii124/jax-mpm.git@fd8ed2caa40a50d01992420660f68ae6ce0d084f"]

[project.urls]
Repository = "https://github.com/lililii124/SoftGripLab"
Issues = "https://github.com/lililii124/SoftGripLab/issues"

[project.scripts]
softgriplab = "softgriplab.cli:main"

[tool.setuptools.packages.find]
include = ["softgriplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mpm: optional JAX-MPM integration tests", "robot: optional PyBullet integration tests"]
